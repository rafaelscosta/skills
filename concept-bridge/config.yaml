pack:
  name: concept-bridge
  version: "3.1.0"
  owner_squad: sinkra-squad

contract:
  schema: concept-bridge/receipt@1
  input_trust: untrusted
  repository_scope: read_only
  mutation_scope: none
  network_default: deny
  provider_default: deny
  publication_default: deny
  output_root: outputs/businesses/{business}/concept-bridge/{run_id}
  original_input_overwrite: deny
  lifecycle_states: [PLANNED, BOUNDARY_INFERRED, ROUTED, COMPOSED, REPRESENTATION_ROUTED, VERIFIED, HANDOFF, FAILED, BLOCKED]
  terminal_success: HANDOFF
  truth_gate_required: true
  knowledge_boundary_required: true
  stopping_rule_required: true
  visual_required: conditional
  representation_router_required_when_visual: true
  diagram_contract_required_when_structural: true
  rendered_visual_required: true

certification:
  visual_behavior:
    status: pending
    protocol: evals/visual-certification/README.md
    route_gate_required_cases: 15
    render_gate_required_cases: 6
    generator_oracle_separation_required: true
    certified_claim: "CONCEPT-BRIDGE v3.1 VISUAL BEHAVIOR: CERTIFIED"
