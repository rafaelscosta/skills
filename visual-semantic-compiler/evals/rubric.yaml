version: 3
scale:
  0: absent, incorrect, unsafe, or unverifiable
  1: present but incomplete, weakly bounded, or only partially validated
  2: complete, correct, minimal, and proven at the claimed layer

dimensions:
  - id: semantic_fidelity
    question: Does the IR preserve the upstream mental model or source invariants without strengthening unsupported claims?
  - id: representation_fit
    question: Does class/type match the already-selected cognitive representation?
  - id: relationship_semantics
    question: Does every material edge state a real semantic relationship with valid endpoints?
  - id: provenance
    question: Are explicit, inferred, general-knowledge, and unknown claims bounded truthfully?
  - id: minimality
    question: Does every entity, edge, beat, group, and view earn its place at the selected depth?
  - id: prose_independence
    question: Does text_equivalent preserve the truth-critical model without rendering?
  - id: semantic_validation
    question: Does the frozen semantic candidate pass the R1 validator?
  - id: layout_validation
    question: When canonical rendering is used, does visual-layout/v1 pass containment, separation, edge-node, crossing, label, and reading-direction checks?
  - id: artifact_integrity
    question: Does the delivered HTML bind to semantic/layout digests, use accessible inline SVG, remain self-contained, and pass static artifact validation?
  - id: browser_evidence
    question: Does the exact delivered artifact pass the R3 Chromium evidence gate at every required desktop viewport with current screenshots bound to its SHA-256?
  - id: perceptual_review_grounding
    question: Did an identified human or vision-capable model inspect the exact retained screenshots and record concrete defects or a zero-defect pass?
  - id: revision_binding
    question: Do the review artifact SHA and evidence SHA match the exact bytes reviewed, with no stale evidence carried across revisions?
  - id: claim_honesty
    question: Are semantic, layout, artifact, browser-evidence, perceptual, and mobile-support claims kept strictly separate?

thresholds:
  semantic_only:
    minimum_total: 13
    required_two: [semantic_fidelity, representation_fit, relationship_semantics, prose_independence, semantic_validation]
  canonical_render:
    minimum_total: 19
    required_two: [semantic_fidelity, representation_fit, semantic_validation, layout_validation, artifact_integrity, claim_honesty]
  trusted_visual_delivery:
    minimum_total: 25
    required_two: [semantic_fidelity, representation_fit, semantic_validation, layout_validation, artifact_integrity, browser_evidence, perceptual_review_grounding, revision_binding, claim_honesty]

automatic_failure:
  - Missing or dangling relationship endpoint.
  - Unsupported causal relationship strengthened beyond its provenance.
  - Mixed views repeat the same cognitive question.
  - Canonical terminology diverges from upstream prose without explicit equivalence.
  - Text equivalent is absent.
  - Semantic validator returns non-zero but the run claims semantic success.
  - Layout validator returns non-zero but the run delivers the canonical artifact as trusted.
  - A truthful semantic relationship is deleted solely to make geometry pass.
  - Artifact validator returns non-zero but the run claims successful delivery.
  - Raw Mermaid, external diagram runtime, or unbound artifact bytes are substituted for the canonical delivered visual.
  - Browser evidence fails or is skipped but the run claims a trusted perceptual pass.
  - A perceptual pass is claimed without inspecting screenshots from the exact artifact revision.
  - Reviewer identity is missing from a perceptual pass.
  - A passed perceptual review contains known defects.
  - Artifact or evidence hashes in the review do not match the exact evidence receipt.
  - Stale screenshots survive a failed or skipped recapture and are presented as current evidence.
  - A desktop perceptual pass is generalized into a mobile usability claim.
