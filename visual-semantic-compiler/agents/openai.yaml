interface:
  display_name: Visual Semantic Compiler
  short_description: Prova significado, geometria, artefato e legibilidade sem misturar os gates
  default_prompt: Use $visual-semantic-compiler after the upstream reasoning skill has selected
    a useful visual. Compile and validate the renderer-agnostic semantic IR, freeze it, then when
    rendering is requested run the deterministic layout and HTML + inline-SVG delivery path.
    After static artifact validation, capture browser evidence at the required desktop viewports,
    keep perceptual review pending until an identified human or vision-capable model inspects the
    exact screenshots, and validate the review's artifact/evidence hash bindings before claiming
    perceptually-passed. Fail closed for unsupported renderers or unavailable evidence, and never
    generalize the desktop perceptual gate into a mobile claim. Keep user-visible labels and text
    equivalents in Brazilian Portuguese unless the user requests another language.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  allow_implicit_invocation: true
  products:
  - chatgpt
  - codex
  - api
  - atlas
